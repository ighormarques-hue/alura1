<!-- Cartão de Acomodação Airbnb -->
<div class="card-hospedagem">
  <div class="card-imagem">
    <img src="https://via.placeholder.com/300x200" alt="Imagem da acomodação">
    <span class="badge-favorito">♥</span>
  </div>
  
  <div class="card-info">
    <div class="card-localizacao">
      <h3>Casa Aconchegante no Centro</h3>
      <p>São Paulo, Brasil</p>
    </div>
    
    <div class="card-pontuacao">
      <span class="estrelas">★★★★★</span>
      <span class="nota">4.8</span>
      <span class="avaliacoes">(248 avaliações)</span>
    </div>
    
    <div class="card-hospede">
      <p>Hospedado por <strong>João Silva</strong></p>
      <div class="hospede-pontuacao">
        <span class="estrelas-hospede">★★★★☆</span>
        <span class="nota-hospede">4.7</span>
      </div>
    </div>
    
    <div class="card-preco">
      <p class="preco-valor">R$ 250 <span class="preco-noite">/noite</span></p>
      <p class="preco-total">Total: R$ 1.750 (7 noites)</p>
    </div>
    
    <button class="btn-reservar">Reservar</button>
  </div>
</div>
